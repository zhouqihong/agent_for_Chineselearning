<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉渝五洲-中文助学AI矩阵</title>
<style>
  :root {
    --bg: #f7f4ee;
    --card: #ffffff;
    --ink: #2b2118;
    --sub: #7a6f60;
    --line: #e8e0d2;
    --accent: #b23a2e;       /* 中国红 */
    --accent-2: #c8a06a;     /* 金 */
    --jade: #3f7d6e;         /* 青玉 */
    --shadow: 0 10px 30px rgba(60, 40, 20, 0.08);
    --shadow-hover: 0 18px 44px rgba(60, 40, 20, 0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部横幅 */
  .hero {
    position: relative;
    background: linear-gradient(135deg, #3a1f1a 0%, #6e2f24 55%, #8a3d2e 100%);
    color: #fdf6ec;
    padding: 72px 24px 84px;
    text-align: center;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(200,160,106,.18) 0, transparent 30%),
      radial-gradient(circle at 85% 75%, rgba(200,160,106,.15) 0, transparent 32%);
    pointer-events: none;
  }
  .hero .badge {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    position: relative;
  }
  .hero .badge img {
    height: 112px; width: auto;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.35));
  }
  .hero h1 {
    font-size: clamp(30px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: 2px;
    position: relative;
  }
  .hero h1 .en {
    display: block;
    font-size: .34em;
    font-weight: 500;
    letter-spacing: 6px;
    color: #e8c88a;
    margin-top: 10px;
    text-transform: uppercase;
  }
  .hero p.sub {
    margin-top: 18px;
    font-size: 15px;
    color: #e9d9c0;
    max-width: 640px;
    margin-left: auto; margin-right: auto;
    position: relative;
  }
  .hero .stats {
    margin-top: 30px;
    display: flex;
    gap: 34px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
  }
  .hero .stat { text-align: center; }
  .hero .stat b {
    display: block;
    font-size: 30px;
    color: #e8c88a;
    font-weight: 800;
  }
  .hero .stat span { font-size: 13px; color: #e9d9c0; }

  /* 主体容器 */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* 分类导航 */
  .filters {
    position: relative;
    margin-top: -40px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    border: 1px solid var(--line);
  }
  .filters button {
    border: 1px solid var(--line);
    background: #faf7f0;
    color: var(--sub);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .filters button:hover { border-color: var(--accent); color: var(--accent); }
  .filters button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(178,58,46,.28);
  }

  /* 搜索 */
  .searchbar {
    margin: 28px auto 6px;
    max-width: 520px;
    position: relative;
  }
  .searchbar input {
    width: 100%;
    padding: 13px 20px 13px 46px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 15px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
    outline: none;
    transition: border .2s, box-shadow .2s;
  }
  .searchbar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(178,58,46,.12);
  }
  .searchbar svg {
    position: absolute;
    left: 18px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    fill: none; stroke: #b4a694;
    stroke-width: 2;
  }

  /* 分组标题 */
  .group-title {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 46px 0 20px;
  }
  .group-title h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .group-title .bar {
    width: 4px; height: 24px;
    background: var(--accent);
    border-radius: 2px;
  }
  .group-title .cnt {
    font-size: 13px;
    color: var(--sub);
    background: #efe8da;
    padding: 3px 12px;
    border-radius: 999px;
  }

  /* 卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 24px 20px;
    box-shadow: var(--shadow);
    transition: transform .22s, box-shadow .22s, border-color .22s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(178,58,46,.35);
  }
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .28s;
  }
  .card:hover::after { transform: scaleX(1); }

  .card .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .card .icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .card .tag {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #f3ede0;
    color: #8a7a60;
    white-space: nowrap;
  }
  .card h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: .5px;
  }
  .card p.desc {
    font-size: 13.5px;
    color: var(--sub);
    flex: 1;
    margin-bottom: 16px;
  }
  .card .author {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-size: 13px;
    color: #8a7a60;
  }
  .card .author .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--jade);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }
  .card .go {
    margin-left: auto;
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .card .go svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; }

  /* 页脚 */
  footer {
    margin-top: 70px;
    padding: 40px 24px;
    text-align: center;
    color: #9a8c78;
    font-size: 13px;
    border-top: 1px solid var(--line);
    background: #f1ece1;
  }
  footer b { color: var(--accent); }

  /* 空状态 */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--sub);
    display: none;
  }
  .empty.show { display: block; }

  @media (max-width: 640px) {
    .hero { padding: 54px 18px 70px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

    { name: "论文批改 · 学生版", icon: "🎓", color: "#e2ecf5", cat: "exam", author: "马亿蕾", url: "https://www.coze.cn/s/AdIPHIMWAXg/", tag: "论文批改", desc: "论文批改智能体学生端，辅助学生批改论文，发现并纠正其中的问题。" },

    // 教学类
    { name: "文化体验课任务设计助手", icon: "🏮", color: "#fbeae2", cat: "teach", author: "高歌", url: "https://www.coze.cn/s/fJbNsBFRcYQ/", tag: "教学设计", desc: "为国际中文教师生成可直接上课的中国文化体验课详案。输入主题、国别、年龄、水平、对照与课时，即输出含教学目标、文化知识点、HSK 词汇句型、游戏化过程、板书与评估的完整教案，覆盖八大类约五十主题。" },
    { name: "韩国职场中文双智能体-教师端", icon: "👩‍🏫", color: "#e2f0ec", cat: "teach", author: "张译心", url: "https://cnwork.pages.dev/cnwork-teacher.html", tag: "备课教研", desc: "装在电脑里的「中文陪练老师 + 教研组」教师端，老师用它备课，与学生端通过「匿名学情」自动连接，全程本地运行、不上传任何数据。" },
    { name: "论文批改 · 教师版", icon: "📚", color: "#f0e8f0", cat: "teach", author: "马亿蕾", url: "https://www.coze.cn/s/-H__ZTkX93M/", tag: "论文批改", desc: "论文批改智能体教师端，辅助教师高效批改学生论文。" },

    // 管理类
    { name: "学情智能体", icon: "📊", color: "#e8ecf0", cat: "manage", author: "张馨悦", url: "https://473038c6dbac4f1098024f75940f0eb9.app.workbuddy.host", tag: "教学管理", desc: "辅助教师做评价反馈与教学管理。基于真实班级数据，回答「谁积分高 / 谁落后 / 谁宠物饿了 / 教学建议」，并给出单个学生的行为画像。" },

    // 学习平台（独立补充板块，不受分类筛选影响，始终置于最下方）
    { name: "中文联盟", icon: "🌐", color: "#e8f0e2", cat: "platform", author: "中文联盟", url: "https://www.chineseplus.net/ability/62", tag: "官方平台", desc: "中外语言交流合作中心官方中文学习平台，提供权威课程、能力测评与学习资源。" },
    { name: "国际中文教育辅助学习AI助手", icon: "🤖", color: "#e2ecf5", cat: "platform", author: "学习平台", url: "https://zhouqihong.github.io/tools/home", tag: "AI工具集", desc: "面向国际中文教育的辅助学习 AI 助手工具集，汇集多项智能学习工具，助力中文教与学。" },
    { name: "面向西语母语者的汉语学习平台", icon: "🇪🇸", color: "#fde8e2", cat: "platform", author: "学习平台", url: "https://zhouqihong.github.io/Chineselearning/", tag: "西语学习", desc: "专为西班牙语母语者设计的汉语学习平台，提供针对性学习资源与练习。" },
  ];

  const catNames = {
    learn: "学习 · 输入与理解",
    practice: "练习 · 巩固与应用",
    exam: "测评 · 检验与反馈",
    teach: "教学 · 备课与设计",
    manage: "管理 · 学情与评价",
    platform: "学习平台 · 拓展资源",
  };

  let currentFilter = "all";
  let currentQuery = "";

  function render() {
    const container = document.getElementById("container");
    const empty = document.getElementById("empty");
    container.innerHTML = "";

    // 按分类分组（platform 板块不受分类筛选与搜索影响，始终保留）
    const groups = {};
    agents.forEach(a => {
      if (a.cat !== "platform") {
        if (currentFilter !== "all" && a.cat !== currentFilter) return;
        if (currentQuery) {
          const q = currentQuery.toLowerCase();
          const hay = (a.name + a.desc + a.author + a.tag).toLowerCase();
          if (!hay.includes(q)) return;
        }
      }
      if (!groups[a.cat]) groups[a.cat] = [];
      groups[a.cat].push(a);
    });

    const keys = Object.keys(groups);
    if (keys.length === 0) {
      empty.classList.add("show");
      return;
    }
    empty.classList.remove("show");

    const order = ["learn", "practice", "exam", "teach", "manage"];
    const sorted = order.filter(k => groups[k]);
    // 学习平台板块永远排在最后
    if (groups["platform"]) sorted.push("platform");

    sorted.forEach(cat => {
      const list = groups[cat];
      const section = document.createElement("section");
      section.innerHTML = `
        <div class="group-title">
          <div class="bar"></div>
          <h2>${catNames[cat]}</h2>
          <span class="cnt">${list.length} 个</span>
        </div>
        <div class="grid"></div>
      `;
      const grid = section.querySelector(".grid");
      list.forEach(a => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = a.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.innerHTML = `
          <div class="top">
            <div class="icon" style="background:${a.color}">${a.icon}</div>
            <span class="tag">${a.tag}</span>
          </div>
          <h3>${a.name}</h3>
          <p class="desc">${a.desc}</p>
          <div class="author">
            <span class="avatar">${a.author[0]}</span>
            <span>${a.author}</span>
            <span class="go">打开使用
              <svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg>
            </span>
          </div>
        `;
        grid.appendChild(card);
      });
      container.appendChild(section);
    });
  }

  document.getElementById("filters").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.f;
    render();
  });

  document.getElementById("search").addEventListener("input", e => {
    currentQuery = e.target.value.trim();
    render();
  });

  render();
</script>
</body>
</html>
